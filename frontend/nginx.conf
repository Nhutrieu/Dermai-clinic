# Preserve HTTPS information supplied by a trusted host-level reverse proxy,
# while still producing a useful value during direct local development.
map $http_x_forwarded_proto $dermai_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_tokens off;
  charset utf-8;
  charset_types text/css application/javascript;
  client_max_body_size 3m;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    # Nginx does not inherit server-level add_header directives when a location
    # defines its own header, so repeat the security contract here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
    # Always fetch the current SPA entry point after a deployment. Generated JS/CSS filenames are content-hashed and remain safe to cache.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $dermai_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
  }

  location /ai/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $dermai_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 90s;
  }
}
