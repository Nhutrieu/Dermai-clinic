server {
  listen 80;
  charset utf-8;
  charset_types text/css application/javascript;
  client_max_body_size 3m;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://gateway:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header X-Request-ID $request_id; }
  location /ai/ { proxy_pass http://gateway:8080; proxy_set_header X-Request-ID $request_id; }
}
