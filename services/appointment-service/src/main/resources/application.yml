server.port: 8085
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/dermai?currentSchema=appointment}
    username: ${DB_USER:dermai}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.default_schema: appointment
  flyway: {schemas: appointment, create-schemas: true}
management.endpoints.web.exposure.include: health,info
security.service-token: ${SERVICE_TOKEN:}
doctor-service.url: ${DOCTOR_URL:http://doctor-service:8084}
spring.rabbitmq:
  host: ${RABBITMQ_HOST:rabbitmq}
  port: 5672
  username: ${RABBITMQ_USER:guest}
  password: ${RABBITMQ_PASSWORD:guest}
