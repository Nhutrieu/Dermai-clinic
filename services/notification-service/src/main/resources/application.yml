server.port: 8088
spring:
  datasource: {url: "${DB_URL:jdbc:postgresql://postgres:5432/dermai?currentSchema=notification}", username: "${DB_USER:dermai}", password: "${DB_PASSWORD:change-me}"}
  jpa: {open-in-view: false, hibernate.ddl-auto: validate, properties.hibernate.default_schema: notification}
  flyway: {schemas: notification, create-schemas: true}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener.simple:
      default-requeue-rejected: false
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1000
        multiplier: 2
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
services:
  auth-url: ${AUTH_URL:http://auth-service:8082}
  token: ${SERVICE_TOKEN:}
app.mail.from: ${MAIL_FROM:}
management.endpoints.web.exposure.include: health,info
