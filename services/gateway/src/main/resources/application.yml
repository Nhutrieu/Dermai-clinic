server:
  port: 8080
spring:
  application.name: gateway
  data.redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
  cloud.gateway:
    default-filters:
      - AddResponseHeader=X-Content-Type-Options, nosniff
      - AddResponseHeader=X-Frame-Options, DENY
    globalcors:
      cors-configurations:
        '[/**]':
          allowedOrigins:
            - ${CORS_ORIGIN:http://localhost:3000}
            - http://localhost:5173
            - http://127.0.0.1:3000
            - http://127.0.0.1:5173
          allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          allowedHeaders: [Authorization, Content-Type, Idempotency-Key, X-Request-ID]
    routes:
      - id: doctor-profile-websocket
        uri: ${DOCTOR_WS_URL:ws://doctor-service:8084}
        predicates: [Path=/api/v1/doctors/ws/profile]
        filters:
          - name: RequestRateLimiter
            args:
              key-resolver: "#{@clientIpKeyResolver}"
              redis-rate-limiter.replenishRate: 2
              redis-rate-limiter.burstCapacity: 10
      - id: appointment-slot-websocket
        uri: ${APPOINTMENT_WS_URL:ws://appointment-service:8085}
        predicates: [Path=/api/v1/appointments/ws/slots]
        filters:
          - name: RequestRateLimiter
            args:
              key-resolver: "#{@clientIpKeyResolver}"
              redis-rate-limiter.replenishRate: 2
              redis-rate-limiter.burstCapacity: 10
      - id: auth-sensitive
        uri: ${AUTH_URL:http://auth-service:8082}
        predicates:
          - Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/google,/api/v1/auth/refresh,/api/v1/auth/forgot-password,/api/v1/auth/reset-password,/api/v1/auth/verification/send,/api/v1/auth/verification/confirm
        filters:
          - name: RequestRateLimiter
            args:
              key-resolver: "#{@clientIpKeyResolver}"
              redis-rate-limiter.replenishRate: 1
              redis-rate-limiter.burstCapacity: 5
      - id: auth
        uri: ${AUTH_URL:http://auth-service:8082}
        predicates: [Path=/api/v1/auth/**]
      - id: patient-ai-analysis-limited
        uri: ${PATIENT_URL:http://patient-service:8083}
        predicates: [Path=/api/v1/patients/me/ai-assessments/analyze]
        filters:
          - name: RequestRateLimiter
            args:
              key-resolver: "#{@clientIpKeyResolver}"
              redis-rate-limiter.replenishRate: 1
              redis-rate-limiter.burstCapacity: 3
      - id: patients
        uri: ${PATIENT_URL:http://patient-service:8083}
        predicates: [Path=/api/v1/patients/**]
      - id: doctors
        uri: ${DOCTOR_URL:http://doctor-service:8084}
        predicates: [Path=/api/v1/doctors/**]
      - id: services
        uri: ${DOCTOR_URL:http://doctor-service:8084}
        predicates: [Path=/api/v1/services/**]

      - id: appointments
        uri: ${APPOINTMENT_URL:http://appointment-service:8085}
        predicates: [Path=/api/v1/appointments/**]
      - id: payments
        uri: ${PAYMENT_URL:http://payment-service:8089}
        predicates: [Path=/api/v1/payments/**]
      - id: medical-records
        uri: ${MEDICAL_RECORD_URL:http://medical-record-service:8086}
        predicates: [Path=/api/v1/medical-records/**]
      - id: billing
        uri: ${PRESCRIPTION_URL:http://prescription-service:8087}
        predicates: [Path=/api/v1/billing/**]
      - id: medicines
        uri: ${PRESCRIPTION_URL:http://prescription-service:8087}
        predicates: [Path=/api/v1/medicines/**]
      - id: pharmacy
        uri: ${INVENTORY_URL:http://inventory-service:8010}
        predicates:
          - Path=/api/v1/pharmacy/**,/api/v1/inventory/**
      - id: prescriptions
        uri: ${PRESCRIPTION_URL:http://prescription-service:8087}
        predicates: [Path=/api/v1/prescriptions/**]
      - id: ai-public-chat
        uri: ${AI_URL:http://ai-service:8000}
        predicates: [Path=/ai/public-chat]
        filters:
          - StripPrefix=1
          - name: RequestRateLimiter
            args:
              key-resolver: "#{@clientIpKeyResolver}"
              redis-rate-limiter.replenishRate: 1
              redis-rate-limiter.burstCapacity: 5
      - id: ai
        uri: ${AI_URL:http://ai-service:8000}
        predicates:
          - Path=/ai/health,/ai/chat,/ai/support-chat
        filters: [StripPrefix=1]
management.endpoints.web.exposure.include: health,info
security.jwt.secret: ${JWT_SECRET:replace-with-at-least-32-random-characters}
