server.port: 8083
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/dermai?currentSchema=patient}
    username: ${DB_USER:dermai}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.default_schema: patient
  flyway: {schemas: patient, create-schemas: true}
management.endpoints.web.exposure.include: health,info
services:
  appointment-url: ${APPOINTMENT_URL:http://appointment-service:8085}
  token: ${SERVICE_TOKEN:}
