server.port: 8087
spring:
  datasource: {url: "${DB_URL:jdbc:postgresql://postgres:5432/dermai?currentSchema=prescription}", username: "${DB_USER:dermai}", password: "${DB_PASSWORD:change-me}"}
  jpa: {open-in-view: false, hibernate.ddl-auto: validate, properties.hibernate.default_schema: prescription}
  flyway: {schemas: prescription, create-schemas: true}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
management.endpoints.web.exposure.include: health,info
services:
  record-url: ${MEDICAL_RECORD_URL:http://medical-record-service:8086}
  appointment-url: ${APPOINTMENT_URL:http://appointment-service:8085}
  payment-url: ${PAYMENT_URL:http://payment-service:8089}
  doctor-url: ${DOCTOR_URL:http://doctor-service:8084}
  token: ${SERVICE_TOKEN:}