server.port: 8084
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/dermai?currentSchema=doctor}
    username: ${DB_USER:dermai}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.default_schema: doctor
  flyway: {schemas: doctor, create-schemas: true}
management.endpoints.web.exposure.include: health,info
services.appointment-url: ${APPOINTMENT_URL:http://appointment-service:8085}
security.service-token: ${SERVICE_TOKEN:}
